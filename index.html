let ncHook=null,ncEdit=null;function renameCat(i){newCat();ncEdit=+i;$('ncTitle').textContent='카테고리 이름 변경';$('ncSave').textContent='변경';$('ncInput').value=cats[i];ncPrev()}
function newCat(h){ncHook=h||null;ncEdit=null;$('ncTitle').textContent='새 카테고리';$('ncSave').textContent='만들기';$('ncInput').value='';$('ncErr').style.display='none';ncPrev();$('catOverlay').classList.add('open');setTimeout(()=>$('ncInput').focus(),60)}
function ncPrev(){const v=$('ncInput').value.trim();$('ncPrev').innerHTML=v?`<span style="background:${colorOf(v)}20;color:${colorOf(v)}">${esc(v)}</span>`:'<em>이름을 입력하면 미리보기가 떠요</em>'}
const closeNc=()=>{$('catOverlay').classList.remove('open');ncHook=null};
function ncDone(){const n=$('ncInput').value.trim();if(!n)return;
  if(ncEdit!==null){const old=cats[ncEdit];if(n==old){closeNc();return}
    if(cats.includes(n)){$('ncErr').textContent='이미 있는 카테고리예요.';$('ncErr').style.display='block';return}
    const b=col.firestore.batch();notes.filter(x=>x.cat==old).forEach(x=>b.update(col.doc(x.id),{cat:n}));b.commit();
    const l=[...cats];l[ncEdit]=n;if(active==old)active=n;closeNc();saveCats(l);return}if(cats.includes(n)){$('ncErr').textContent='이미 있는 카테고리예요.';$('ncErr').style.display='block';return}const h=ncHook;selCat=n;closeNc();saveCats([...cats,n]);if(h)h(n)}
$('ncInput').oninput=ncPrev;$('ncInput').onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)ncDone()};
$('ncSave').onclick=ncDone;$('ncCancel').onclick=closeNc;$('catOverlay').onclick=e=>{if(e.target.id=='catOverlay')closeNc()};
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

function catBar(){
  $('catBar').innerHTML=`<button class="cat-chip ${active?'':'active'}" data-i="">All</button><button class="cat-chip ${active=='★'?'active':''}" data-i="fav">★ 즐겨찾기</button>`+cats.map((c,i)=>`<button class="cat-chip ${c==active?'active':''}" data-i="${i}">${esc(c)}${c==active?`<i data-e="${i}">✎</i><i data-x="${i}">×</i>`:''}</button>`).join('')+'<button class="cat-chip new" data-new="1">＋ 카테고리</button>';
}
$('catBar').onclick=e=>{const d=e.target.dataset,b=e.target.closest('.cat-chip');if(!b)return;
  if(d.e!==undefined){renameCat(d.e);return}
  if(d.x!==undefined){const c=cats[d.x];if(confirm(`"${c}" 카테고리를 삭제할까요? (메모는 미분류로 이동)`)){notes.filter(n=>n.cat==c).forEach(n=>col.doc(n.id).update({cat:''}));active=null;saveCats(cats.filter(x=>x!=c))}return}
  if(b.dataset.new){newCat();return}
  active=b.dataset.i===''?null:b.dataset.i=='fav'?'★':cats[b.dataset.i];catBar();render()};

const linkOf=n=>n.link!==undefined?n.link:(n.url||firstUrl(n.text||''));
const bodyOf=n=>{let b=n.text||'';if(n.link===undefined){const u=n.url||firstUrl(b);if(u)b=b.split(u).join('').trim()}return b};
function parts(n){let b=bodyOf(n),t=(n.title||'').trim();if(!t){const i=b.indexOf('\n');t=(i<0?b:b.slice(0,i)).trim();b=i<0?'':b.slice(i+1).trim()}if(!t)t=dom(linkOf(n))||'제목 없음';return{t,b}}
function card(n){
  const el=document.createElement('div');el.className='card'+(n.img||n.thumb?'':' noim');const im=n.img||n.thumb,u=linkOf(n),{t,b}=parts(n);
  let h=`<button class="fav ${n.fav?'on':''}" title="즐겨찾기">★</button>`+(im?`<div class="img-wrap"><img src="${esc(im)}" loading="lazy">${n.pin?'<span class="img-count">📌</span>':''}</div>`:(n.up&&Date.now()-n.ts<120000?'<div class="img-wrap"><div class="upl">이미지 올리는 중…</div></div>':''));
  h+=`<div class="meta"><div class="name">${esc(t)}</div>`;
  if(b)h+=`<div class="body">${esc(b)}</div>`;
  if(u)h+=`<div class="link-tag">🔗 ${esc(dom(u))}</div>`;
  if(n.cat||(!im&&n.pin))h+=`<div class="cats">${!im&&n.pin?'<span style="background:#eee">📌</span>':''}${n.cat?`<span style="background:${colorOf(n.cat)}20;color:${colorOf(n.cat)}">${esc(n.cat)}</span>`:''}</div>`;
  el.innerHTML=h+'</div>';el.querySelector('.fav').onclick=e=>{e.stopPropagation();col.doc(n.id).update({fav:n.fav?0:1})};
  if(selMode){el.insertAdjacentHTML('afterbegin','<span class="chk"></span>');if(picked.has(n.id))el.classList.add('picked')}
  el.onclick=()=>{if(!selMode)return openLb(n);picked.has(n.id)?picked.delete(n.id):picked.add(n.id);el.classList.toggle('picked');updateBar()};return el}
function render(){
  const q=$('searchInput').value.trim().toLowerCase();
  const l=notes.filter(n=>(!active||(active==='★'?n.fav:n.cat==active))&&`${n.title||''} ${n.text||''} ${linkOf(n)}`.toLowerCase().includes(q)).sort((a,b)=>(b.pin||0)-(a.pin||0));
  shown=l;const ids=new Set(l.map(n=>n.id));picked.forEach(id=>ids.has(id)||picked.delete(id));updateBar();
  const g=$('grid');g.innerHTML='';$('emptyState').style.display=l.length?'none':'block';
  const k=cols(),cs=[];for(let i=0;i<k;i++){const c=document.createElement('div');c.className='grid-col';cs.push(c);g.appendChild(c)}
  l.forEach((n,i)=>cs[i%k].appendChild(card(n)))}
let rc=cols();addEventListener('resize',()=>{if(cols()!=rc){rc=cols();render()}});
$('searchInput').oninput=render;

/* add / edit modal */
function selCats(){
  $('catSelect').innerHTML=cats.map(c=>`<button type="button" class="tag ${c==selCat?'on':''}" data-c="${esc(c)}" style="${c==selCat?`background:${colorOf(c)}`:''}">${esc(c)}</button>`).join('')+'<button type="button" class="tag new" data-new="1">＋ 새로</button>'}
$('catSelect').onclick=e=>{const b=e.target.closest('.tag');if(!b)return;if(b.dataset.new){newCat();return}selCat=selCat==b.dataset.c?'':b.dataset.c;selCats()};
function preview(){
  if(prevUrl)URL.revokeObjectURL(prevUrl);prevUrl=file?URL.createObjectURL(file):'';
  const src=prevUrl||curImg;
  $('previewGrid').innerHTML=src?`<div class="preview-item"><img src="${esc(src)}"><button class="remove" id="rmF" type="button" title="이미지 삭제">✕</button></div>`:'';
  if(src)$('rmF').onclick=()=>{file=null;curImg='';$('fileInput').value='';preview();ok()}}
const ok=()=>{$('saveAdd').disabled=!($('titleInput').value.trim()||$('textInput').value.trim()||$('linkInput').value.trim()||file||curImg)};
function setFile(f){file=f;preview();ok()}
function openAdd(n){
  editId=n?n.id:null;file=null;curImg=n?(n.img||''):'';preview();$('fileInput').value='';
  $('mTitle').textContent=n?'메모 수정':'새 메모 추가';$('dropZone').style.display='';
  $('titleInput').value=n?(n.title||''):'';$('textInput').value=n?bodyOf(n):'';$('linkInput').value=n?linkOf(n):'';selCat=n?(n.cat||''):(active&&active!=='★'?active:'');selCats();ok();
  $('addError').style.display='none';$('overlay').classList.add('open');$('textInput').focus()}
const closeAdd=()=>$('overlay').classList.remove('open');
$('openAdd').onclick=()=>openAdd();$('cancelAdd').onclick=closeAdd;
$('overlay').onclick=e=>{if(e.target.id=='overlay')closeAdd()};
$('textInput').oninput=$('titleInput').oninput=$('linkInput').oninput=ok;
$('textInput').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key=='Enter'&&!$('saveAdd').disabled)save()};
$('dropZone').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>e.target.files[0]&&setFile(e.target.files[0]);
$('dropZone').ondragover=e=>{e.preventDefault();$('dropZone').classList.add('drag')};
$('dropZone').ondragleave=()=>$('dropZone').classList.remove('drag');
$('dropZone').ondrop=()=>$('dropZone').classList.remove('drag');
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(!f)return;if(!$('overlay').classList.contains('open'))openAdd();setFile(f)});
document.addEventListener('paste',e=>{
  const cd=e.clipboardData;if(!cd||$('lightbox').classList.contains('open')||$('catOverlay').classList.contains('open')||$('moveOverlay').classList.contains('open'))return;
  let f=[...cd.files].find(x=>x.type.startsWith('image/'));
  if(!f){const it=[...cd.items].find(x=>x.kind=='file'&&x.type.startsWith('image/'));f=it&&it.getAsFile()}
  if(!f)return;
  const open=$('overlay').classList.contains('open');
  e.preventDefault();if(!open)openAdd();setFile(f)});

async function thumb(text){
  const u=firstUrl(text);if(!u)return{};
  const y=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if(y)return{url:u,thumb:`https://img.youtube.com/vi/${y[1]}/hqdefault.jpg`,vid:1};
  const x=u.match(/(?:twitter|x)\.com\/(\w+)\/status(?:es)?\/(\d+)/i);
  if(x)try{const j=await(await fetch(`https://api.fxtwitter.com/${x[1]}/status/${x[2]}`)).json();const f=(((j.tweet||{}).media||{}).all||[])[0];
    if(f){const t=f.type=='photo'?f.url:(f.thumbnail_url||f.url);if(t)return{url:u,thumb:t,vid:f.type=='photo'?0:1}}}catch(e){}
  const tf=x=>fetch(x,{signal:AbortSignal.timeout(7000)}),vd=/vimeo|tiktok|twitch|dailymotion|tv\.naver|chzzk/.test(u);
  try{const d=(await(await tf('https://api.microlink.io?url='+encodeURIComponent(u))).json()).data||{};
    if(d.image&&d.image.url)return{url:u,thumb:d.image.url,vid:(d.video||vd)?1:0}}catch(e){}
  try{const h=await(await tf('https://api.allorigins.win/raw?url='+encodeURIComponent(u))).text();
    const m=new DOMParser().parseFromString(h,'text/html').querySelector('meta[property="og:image"],meta[property="og:image:url"],meta[name="twitter:image"]');
    if(m&&m.content)return{url:u,thumb:new URL(m.content,u).href,vid:vd?1:0}}catch(e){}
  return{url:u,thumb:'https://image.thum.io/get/width/700/crop/700/'+u,vid:0}}
async function shrink(f){
  if(!/^image\/(jpe?g|png|webp)/i.test(f.type)||f.size<400000)return f;
  try{const b=await createImageBitmap(f),r=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');
    c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(x=>res(x||f),'image/jpeg',.85))}catch(e){return f}}
async function upload(f){
  const s=await shrink(f),fd=new FormData();fd.append('file',s,'img.jpg');fd.append('upload_preset',PRESET);
  const j=await(await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:fd})).json();
  if(!j.secure_url)throw new Error(j.error&&j.error.message);
  return j.secure_url.replace('/upload/','/upload/f_auto,q_auto,w_1000/')}
async function save(){
  const title=$('titleInput').value.trim(),text=$('textInput').value.trim(),cat=selCat,f=file,id=editId,keep=curImg;let link=$('linkInput').value.trim();
  if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
  closeAdd();
  if(id){const old=notes.find(x=>x.id==id),d={title,text,link,cat};
    if(f)d.up=1;else d.img=keep;
    if(!link){d.thumb='';d.vid=0}
    col.doc(id).update(d).catch(e=>alert('저장 실패: '+e.message));
    if(f){try{await col.doc(id).update({img:await upload(f),up:0})}catch(e){col.doc(id).update({up:0});alert('이미지 업로드 실패: '+e.message)}}
    else if(link&&!keep&&(link!==linkOf(old)||!old.thumb)){const th=await thumb(link);col.doc(id).update({thumb:th.thumb||'',vid:th.vid||0})}
    return}
  const ref=col.doc();
  ref.set({title,text,link,img:'',cat,pin:0,ts:Date.now(),up:f?1:0}).catch(e=>alert('저장 실패: '+e.message));
  if(f){try{ref.update({img:await upload(f),up:0})}catch(e){ref.update({up:0});alert('이미지 업로드 실패: '+e.message)}}
  else if(link){const th=await thumb(link);if(th.thumb)ref.update({thumb:th.thumb,vid:th.vid||0,url:th.url})}}
$('saveAdd').onclick=save;

/* lightbox */
function openLb(n){
  lbId=n.id;const im=n.img||n.thumb,u=linkOf(n),{t,b}=parts(n);
  $('lbInner').classList.toggle('noimg',!im);if(im)$('lbImg').src=im;
  $('lbTitle').textContent=t;$('lbText').style.display=b?'block':'none';$('lbText').innerHTML=esc(b).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  $('lbCats').innerHTML=n.cat?`<span style="background:${colorOf(n.cat)}">${esc(n.cat)}</span>`:'';
  $('lbLink').style.display=u?'inline-flex':'none';if(u)$('lbLink').href=u;
  $('lbDate').style.display=n.ts?'block':'none';if(n.ts)$('lbDate').textContent=new Date(n.ts).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  $('lbPin').textContent=n.pin?'고정 해제':'고정';$('lbFav').textContent=n.fav?'★ 즐겨찾기 해제':'★ 즐겨찾기';$('lightbox').classList.add('open')}
const closeLb=()=>$('lightbox').classList.remove('open');
$('lbClose').onclick=closeLb;$('lightbox').onclick=e=>{if(e.target.id=='lightbox')closeLb()};
addEventListener('keydown',e=>{if(e.key=='Escape'){closeLb();closeNc();closeAdd();closeMv()}});
$('lbFav').onclick=()=>{const n=notes.find(x=>x.id==lbId);col.doc(lbId).update({fav:n.fav?0:1});closeLb()};
$('lbPin').onclick=()=>{const n=notes.find(x=>x.id==lbId);col.doc(lbId).update({pin:n.pin?0:1});closeLb()};
$('lbEdit').onclick=()=>{const n=notes.find(x=>x.id==lbId);closeLb();openAdd(n)};
$('lbDelete').onclick=()=>{if(confirm('삭제할까요?')){col.doc(lbId).delete();closeLb()}};

/* multi-select */
function updateBar(){$('selCnt').textContent=picked.size+'개 선택'}
function setSel(on){selMode=on;picked.clear();$('selBtn').textContent=on?'완료':'선택';$('selBar').classList.toggle('on',on);render()}
$('selBtn').onclick=()=>setSel(!selMode);
$('selAll').onclick=()=>{if(picked.size==shown.length)picked.clear();else shown.forEach(n=>picked.add(n.id));render()};
$('selDel').onclick=async()=>{if(!picked.size||!confirm(`${picked.size}개 메모를 삭제할까요?`))return;
  try{const b=col.firestore.batch();picked.forEach(id=>b.delete(col.doc(id)));await b.commit();setSel(false)}catch(e){alert('삭제 실패: '+e.message)}};
const closeMv=()=>$('moveOverlay').classList.remove('open');
$('selMove').onclick=()=>{if(!picked.size)return;
  $('moveSel').innerHTML=['',...cats].map(c=>`<button type="button" class="tag" data-c="${esc(c)}" ${c?`style="color:${colorOf(c)}"`:''}>${c?esc(c):'미분류'}</button>`).join('')+'<button type="button" class="tag new" data-new="1">＋ 새로</button>';
  $('moveOverlay').classList.add('open')};
async function moveTo(c){try{const b=col.firestore.batch();picked.forEach(id=>b.update(col.doc(id),{cat:c}));await b.commit();closeMv();setSel(false)}catch(e){alert('이동 실패: '+e.message)}}
$('moveSel').onclick=e=>{const t=e.target.closest('.tag');if(!t)return;if(t.dataset.new){closeMv();newCat(n=>moveTo(n));return}moveTo(t.dataset.c)};
$('mvCancel').onclick=closeMv;$('moveOverlay').onclick=e=>{if(e.target.id=='moveOverlay')closeMv()};
catBar();selCats();
</script></body></html>
